# 个人兴趣画像。管道每天读取这个文件来决定抓什么、怎么打分。
# 修改后下一次运行即生效。网站上的「点赞 / 不感兴趣」反馈保存在 data/library.json，
# 会和这里的内容一起构成兴趣向量（点赞 = 正样本，不感兴趣 = 负样本）。

arxiv:
  # 抓取的 arXiv 分类（https://arxiv.org/category_taxonomy）
  categories:
    - cs.RO   # Robotics
    - cs.AI   # Artificial Intelligence
    - cs.LG   # Machine Learning
    - cs.CV   # Computer Vision
    - cs.GR   # Graphics：AMP/SMP 等物理角色运动控制与运动先验
  # 只看最近 N 天提交的论文（配合 data/seen-papers.json 去重，不会重复推荐）
  days_back: 7
  # 每个分类每次最多拉多少篇（arXiv 单次请求上限 2000，这里保守一些）
  max_results_per_category: 400

# 研究主线：人形 locomotion / loco-manipulation / sim2real / 通用运动与轨迹跟踪，
# 同时覆盖视觉跑酷、四足与四轮足运动控制。VLA 保留为次要探索方向。
# 每条兴趣会独立编码；当前算法不支持逐条权重，条目数量不等于推荐比例。
# 参考方向：SONIC、BFM-Zero、RGMT、PGMT、Hiking in the Wild。
interests:
  - "reinforcement learning for robust humanoid locomotion, bipedal walking and running"
  - "humanoid loco-manipulation with coordinated whole-body control, walking while carrying and manipulating objects"
  - "sim-to-real transfer for humanoid and legged robot locomotion through dynamics adaptation, system identification and domain randomization"
  - "general-purpose whole-body motion and trajectory tracking for humanoid robots, following diverse unseen reference motions"
  - "scalable humanoid motion tracking and behavioral foundation models for zero-shot whole-body control, as in SONIC, BFM-Zero and RGMT"
  - "perceptive general motion tracking for humanoid robots on uneven terrain, combining reference motions with visual terrain perception as in PGMT"
  - "vision-based humanoid locomotion and parkour using depth images for obstacle traversal, foothold planning and outdoor hiking as in Hiking in the Wild"
  - "agile quadruped robot locomotion and visual parkour on rough terrain with sim-to-real reinforcement learning"
  - "wheeled quadruped and wheel-legged robot locomotion with coordinated driving, stepping and terrain-adaptive whole-body control"
  - "physics-based humanoid character control with adversarial motion priors and reusable score-matching motion priors, as in AMP and SMP"
  # VLA 不屏蔽，但不再给予 VLA / 通用 manipulation 关键词额外加分。
  - "vision-language-action models for embodied robot control and generalizable manipulation"

keywords:
  # 每个词标题命中 +2，正文命中 +1；不是逐词独立权重。
  # 优先具体运动控制词，移除 robot / embodied 等过宽加分词。
  boost:
    - humanoid
    - bipedal
    - locomotion
    - loco-manipulation
    - loco manipulation
    - locomanipulation
    - whole-body control
    - whole body control
    - motion tracking
    - trajectory tracking
    - motion imitation
    - motion retargeting
    - sim-to-real
    - sim2real
    - sim-to-reality
    - legged
    - quadruped
    - quadrupedal
    - wheeled quadruped
    - wheel-legged
    - wheeled-legged
    - wheeled-legged locomotion
    - parkour
    - perceptive locomotion
    - visual locomotion
    - vision-based locomotion
    - perceptive motion tracking
    - terrain-adaptive
    - foothold
    # 缩写按单词边界、不区分大小写匹配，不能单独保证论文相关性。
    - SONIC
    - BFM-Zero
    - BFM_Zero
    - RGMT
    - PGMT
    - Hiking in the Wild
    - adversarial motion priors
    - score-matching motion priors
  # 命中这些词会减分（用来屏蔽你不关心的方向）
  mute:
    - medical imaging
    - histopathology
    - protein
    - molecule
    - recommendation system
    - federated learning

github:
  # 通过 topic 监控的 GitHub 项目
  topics:
    - humanoid-robot
    - legged-robots
    - locomotion
    - quadruped-robot
    - wheel-legged-robot
    - motion-tracking
    - sim-to-real
    - robot-learning
  # 聚焦运动控制，同时保留一个 VLA 查询入口。
  queries:
    - "humanoid motion tracking"
    - "humanoid loco-manipulation"
    - "perceptive locomotion parkour"
    - "wheeled quadruped locomotion"
    - "vision language action robot"
    # 定向发现公开仓库；继续沿用下面的 30 天活跃窗口和 15 star 门槛，参与统一排序。
    # org / user 是 GitHub 搜索限定符；账号名不作为普通关键词匹配。
    - "org:Open-X-Humanoid"
    - "org:LeCAR-Lab"
    - "user:xbpeng"
    # InstinctLab 是仓库，所属组织为 project-instinct。
    - "org:project-instinct"
    # SONIC 对应仓库，避免泛抓 NVlabs 的所有研究方向。
    - "repo:NVlabs/GR00T-WholeBodyControl"
  # 新项目至少要有多少 star 才考虑
  min_stars: 15
  # 「新项目」指最近 N 天创建；「活跃项目」指最近 N 天有推送
  days_back: 30

scoring:
  # fastembed 支持的模型名。bge-small 约 130MB，CPU 上几秒钟就能算完几百篇摘要。
  embedding_model: BAAI/bge-small-en-v1.5
  # 每天保留多少条进入推荐页和搜索索引
  top_k_papers: 50
  top_k_repos: 30
  # 提高具体领域关键词的影响，同时保留语义泛化（相加为 1）。
  # 这是排序倾向，不保证 VLA 等领域的固定占比。
  weights:
    embedding: 0.6
    keyword: 0.4

# 搜索索引保留最近多少天的数据（越大索引文件越大，120 天约 2~3MB）
retention_days: 120
